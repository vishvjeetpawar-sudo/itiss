<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITISS | Deployment Test</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --surface: #ffffff;
      --text: #14232e;
      --muted: #566873;
      --accent: #0b6e8a;
      --ok: #1b7f4b;
      --border: #d5dee4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1a21;
        --surface: #172530;
        --text: #e8eff3;
        --muted: #9db0bc;
        --accent: #5cc3df;
        --ok: #5fd08e;
        --border: #2a3d4a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }
    h1 { margin: 0 0 8px; font-size: 1.9rem; color: var(--accent); }
    p { margin: 0 0 20px; color: var(--muted); }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border: 1px solid var(--ok);
      border-radius: 999px;
      color: var(--ok);
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 600; }
    footer { margin-top: 24px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>ITISS is live</h1>
    <p>This page was built and deployed automatically.</p>
    <span class="status">Deployment successful</span>

    <dl>
      <dt>Pipeline</dt>
      <dd>GitHub → Jenkins → Docker Hub → Server</dd>
      <dt>Version</dt>
      <dd>v1</dd>
      <dt>Page loaded</dt>
      <dd id="time">…</dd>
    </dl>

    <footer>Change the version above, push to GitHub, and check that it updates here.</footer>
  </main>

  <script>
    document.getElementById("time").textContent = new Date().toLocaleString();
  </script>
</body>
</html>
